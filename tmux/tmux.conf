# ═══════════════════════════════════════════════════════════════════
#  tmux configuration — https://github.com/sarsanaee/dot_tmux
#  Installed by ./install.sh  (symlinked to ~/.tmux.conf)
#  Requires tmux >= 3.2 (uses `copy-command`). Check with: tmux -V
# ═══════════════════════════════════════════════════════════════════

# ── Prefix ─────────────────────────────────────────────────────────
unbind-key C-b
set -g prefix C-Space
bind C-Space send-prefix          # press twice to send a literal C-Space
set -g escape-time 0              # no delay for ESC (vim feels instant)
set -g repeat-time 400
set -g focus-events on            # let vim/nvim see focus gain/loss
set -g history-limit 50000        # deep scrollback
set -g display-time 1500
set -g base-index 1               # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Configuration reloaded"

# ── Terminal & colour ──────────────────────────────────────────────
# tmux-256color gives correct italics/colour inside tmux.
# NOTE: if you ssh from inside tmux to a host lacking this terminfo, run:
#   infocmp -x tmux-256color | ssh THEHOST tic -x -
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"     # true colour passthrough

# Disable the alternate screen so tmux output stays in the terminal's own
# scrollback after you detach/exit. (Kept from the original config — remove
# this line if you would rather tmux restore the screen on exit.)
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'

# ═══════════════════════════════════════════════════════════════════
#  COPY / PASTE
# ═══════════════════════════════════════════════════════════════════
# The single most important bit: `copy-command` tells tmux which external
# program receives piped selections. Without it, `copy-pipe-and-cancel`
# copies into tmux's private buffer only and NEVER reaches the system
# clipboard — which is the classic "tmux copy-paste is broken" bug.
#
# Detected at config-load time so this file stays portable across machines:
#   Wayland -> wl-copy  |  X11 -> xclip  |  xsel  |  macOS -> pbcopy
#
# macOS was missing from this chain, so copy-command came up EMPTY on every
# Mac — precisely the failure the paragraph above warns about, and what
# install.sh's verify() reports as "copy-command is EMPTY".
if-shell 'command -v wl-copy >/dev/null 2>&1' \
    "set -s copy-command 'wl-copy --type text/plain'"
if-shell '! command -v wl-copy >/dev/null 2>&1 && command -v xclip >/dev/null 2>&1' \
    "set -s copy-command 'xclip -selection clipboard -in'"
if-shell '! command -v wl-copy >/dev/null 2>&1 && ! command -v xclip >/dev/null 2>&1 && command -v xsel >/dev/null 2>&1' \
    "set -s copy-command 'xsel --clipboard --input'"
if-shell '! command -v wl-copy >/dev/null 2>&1 && ! command -v xclip >/dev/null 2>&1 && ! command -v xsel >/dev/null 2>&1 && command -v pbcopy >/dev/null 2>&1' \
    "set -s copy-command 'pbcopy'"

# Also allow the OSC 52 escape-sequence route. Harmless in gnome-terminal
# (which ignores OSC 52); makes copy work automatically over SSH in
# terminals that do support it — kitty, alacritty, wezterm, iTerm2, foot.
set -g set-clipboard on
# If your terminal supports OSC 52 but tmux doesn't know it, uncomment:
# set -ga terminal-features ',xterm-256color:clipboard'

set -g mouse on
setw -g mode-keys vi

# ── Entering copy mode ─────────────────────────────────────────────
bind Enter copy-mode
bind -n M-Up copy-mode            # Alt-Up scrolls straight into copy mode

# ── Selecting (vi keys) ────────────────────────────────────────────
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    send -X rectangle-toggle      # block selection
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi q      send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# ── Copying: everything below lands in the SYSTEM clipboard ────────
# Bare `copy-pipe-and-cancel` (no argument) pipes through `copy-command`
# set above — that is what makes these reach the real clipboard.
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y     send -X copy-pipe-line         # yank whole line

# ── Mouse selection ────────────────────────────────────────────────
# Drag to select: copies on release but does NOT jump back to the prompt,
# so you keep your scroll position. Click anywhere to clear the highlight.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDown1Pane    send -X clear-selection

# Double-click = copy word, triple-click = copy line. Works both from the
# live pane and from inside copy mode.
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear
bind -n DoubleClick1Pane copy-mode -H \; send -X select-word \; send -X copy-pipe-no-clear
bind -n TripleClick1Pane copy-mode -H \; send -X select-line \; send -X copy-pipe-no-clear

# Wheel scroll enters copy mode instead of spamming the shell history.
bind -T copy-mode-vi WheelUpPane   select-pane \; send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -N3 -X scroll-down

# ── Pasting ────────────────────────────────────────────────────────
# -p = bracketed paste, so editors/shells know it's a paste and don't
# auto-indent or execute a multi-line paste line by line.
bind p paste-buffer -p
bind P paste-buffer -p                    # kept from the original config
bind C-p choose-buffer -Z                 # pick from paste history
# Pull the SYSTEM clipboard into tmux and paste it (prefix + C-v).
# load-buffer reads stdin, so text containing quotes, newlines or $ passes
# through untouched — command substitution would mangle it.
# `pbpaste` added as the final fallback so this works on macOS too.
bind C-v run -b 'clip_out() { wl-paste --no-newline 2>/dev/null || xclip -selection clipboard -out 2>/dev/null || xsel --clipboard --output 2>/dev/null || pbpaste 2>/dev/null; }; clip_out | tmux load-buffer - && tmux paste-buffer -p -t "#{pane_id}"'
# Middle-click pastes the system clipboard
bind -n MouseDown2Pane run -b 'clip_out() { wl-paste --no-newline 2>/dev/null || xclip -selection clipboard -out 2>/dev/null || xsel --clipboard --output 2>/dev/null || pbpaste 2>/dev/null; }; clip_out | tmux load-buffer - && tmux paste-buffer -p -t "#{pane_id}"'

# ═══════════════════════════════════════════════════════════════════
#  Panes, windows, quality of life
# ═══════════════════════════════════════════════════════════════════
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5
set -g status-keys emacs          # emacs keys on the tmux command prompt
set -g aggressive-resize on

# ═══════════════════════════════════════════════════════════════════
#  Plugins (TPM) — keep this block last
# ═══════════════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'              # tpm must declare itself
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save / C-r restore

run '~/.tmux/plugins/tpm/tpm'
